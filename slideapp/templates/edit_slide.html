<!DOCTYPE html>
<html>
<head>
    <title>{{ slide.title }}</title>
    <style>
        body {
            display: flex;
            flex-direction: column; /* Changed for toolbar and main content stacking */
            height: 100vh;
            margin: 0;
        }

        /* Container for editor and preview, and AI panel */
        .main-area {
            display: flex;
            flex-grow: 1; /* Takes remaining height */
            overflow: hidden; /* Prevents content from overflowing body */
        }

        #editor-preview-container {
            display: flex;
            flex-grow: 1; /* Takes available width */
        }

        #editor {
            width: 50%; /* Takes 50% of editor-preview-container */
            height: 100%;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        #preview {
            width: 50%; /* Takes 50% of editor-preview-container */
            height: 100%;
            box-sizing: border-box;
        }

        #ai-feature-panel {
            width: 250px; /* Fixed width for the AI panel */
            padding: 10px;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allows scrolling if content exceeds height */
            background-color: #f0f0f0; /* Light gray background for distinction */
        }

        #ai-feature-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }

        #ai-feature-panel label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        #ai-feature-panel input[type="text"],
        #ai-feature-panel button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box; /* Ensures padding doesn't expand width */
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #ai-feature-panel button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #ai-feature-panel button:hover {
            background-color: #0056b3;
        }

        #ai-topic-tree {
            flex-grow: 1; /* Takes available space in the panel */
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            min-height: 150px; /* Minimum height for usability */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 工具栏样式 */
        #toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        /* 返回主页按钮样式 */
        .return-button {
            background-color: gray;
            border: none;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
        }

        .return-button:hover {
            background-color: gray;
        }
    </style>
</head>
<body>
<!-- 工具栏，包含返回主页的按钮 -->
<div id="toolbar">
    <button class="return-button" onclick="location.href='{% url 'index' %}'">返回主页</button>
</div>

<div class="main-area">
    <div id="editor-preview-container">
        <textarea id="editor"></textarea>
        <div id="preview">
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>
    <div id="ai-feature-panel">
        <h3>AI Topic Expansion</h3>
        
        <label for="ai-keywords">Keywords:</label>
        <input type="text" id="ai-keywords" placeholder="Enter keywords...">
        
        <button id="ai-expand-topic-btn">Expand Topic</button>
        
        <label for="ai-topic-tree">Topic Tree:</label>
        <div id="ai-topic-tree">
            <!-- Topic tree will be populated here by JavaScript -->
        </div>
        
        <div id="ai-feedback-message" style="color: red; font-size: 0.9em; margin-bottom: 10px; min-height: 1.2em;"></div>
        
        <button id="ai-generate-outline-btn">Generate Outline</button>
    </div>
</div>

<!-- 引入 jQuery -->
{% load static %}
<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<!-- 与 WebSocket 进行通信的脚本 -->
<script>
    var slideId = {{ slide.id }};

    // 自动判断使用 ws:// 或 wss://
    var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    var socket = new WebSocket(protocol + window.location.host + '/ws/slide/' + slideId + '/');

    var currentIndices = {h: 0, v: 0};
    var editor = document.getElementById('editor');

    var slides = []; // 存储幻灯片的位置信息
    var lastSlideIndices = {h: -1, v: -1}; // 记录上一次的幻灯片索引

    socket.onopen = function (e) {
        console.log('WebSocket 连接已打开');
        // 加载幻灯片内容
        socket.send(JSON.stringify({
            'action': 'load'
        }));
    };

    socket.onmessage = function (e) {
        var data = JSON.parse(e.data);
        var action = data['action'];

        if (action === 'load') {
            // 加载内容到编辑器
            editor.value = data['content'] ;
            // 解析幻灯片
            slides = parseSlides(editor.value);

            // 初始加载时更新预览
            sendPreview();

            // 初始设置光标位置事件
            onCursorPositionChange();
        } else if (action === 'preview') {
            var html_content = data['html'];

            var iframe = document.getElementById('preview-iframe');

            // 获取当前幻灯片的索引
            if (iframe.contentWindow && iframe.contentWindow.Reveal && iframe.contentWindow.Reveal.getIndices) {
                currentIndices = iframe.contentWindow.Reveal.getIndices();
            }

            // 更新预览 iframe 的内容
            iframe.contentDocument.open();
            iframe.contentDocument.write(html_content);
            iframe.contentDocument.close();

            // 清除错误消息
            clearErrorMessage();

            // 等待 iframe 加载完成后，恢复幻灯片位置
            iframe.onload = function () {
                function restoreSlide() {
                    if (iframe.contentWindow.Reveal && iframe.contentWindow.Reveal.isReady()) {
                        iframe.contentWindow.Reveal.slide(currentIndices.h, currentIndices.v);

                        // 当幻灯片变化时，更新 currentIndices
                        iframe.contentWindow.Reveal.on('slidechanged', function (event) {
                            currentIndices = iframe.contentWindow.Reveal.getIndices();
                        });

                        // 根据光标位置导航到对应的幻灯片
                        navigateToSlide(lastSlideIndices.h, lastSlideIndices.v);
                    } else {
                        setTimeout(restoreSlide, 50);
                    }
                }

                restoreSlide();
            };
        } else if (action === 'error') {
            var errorMessage = data['message'];
            displayErrorMessage(errorMessage);
        }
    };

    socket.onclose = function (e) {
        console.log('WebSocket 连接已关闭');
    };

    // 监听编辑器内容的变化，实时预览
    $('#editor').on('input', function () {
        // 更新幻灯片解析
        slides = parseSlides(editor.value);

        sendPreview();
    });

    function sendPreview() {
        var markdown = $('#editor').val();
        socket.send(JSON.stringify({
            'action': 'preview',
            'markdown': markdown
        }));
    }

    // 显示错误消息
    function displayErrorMessage(message) {
        // 如果不存在错误消息元素，创建一个
        if (!document.getElementById('error-message')) {
            var errorDiv = document.createElement('div');
            errorDiv.id = 'error-message';
            errorDiv.style.position = 'fixed';
            errorDiv.style.bottom = '20px';
            errorDiv.style.left = '20px';
            errorDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
            errorDiv.style.color = '#fff';
            errorDiv.style.padding = '10px';
            errorDiv.style.borderRadius = '5px';
            errorDiv.style.maxWidth = '300px';
            errorDiv.style.zIndex = '1000';
            errorDiv.style.fontSize = '14px';
            errorDiv.style.lineHeight = '1.5';
            document.body.appendChild(errorDiv);
        }

        var errorDiv = document.getElementById('error-message');
        errorDiv.textContent = '语法错误：' + message;
    }

    // 清除错误消息
    function clearErrorMessage() {
        var errorDiv = document.getElementById('error-message');
        if (errorDiv) {
            errorDiv.parentNode.removeChild(errorDiv);
        }
    }

    // 自动保存功能，每分钟保存一次
    setInterval(function () {
        saveSlide();
    }, 60000); // 60000 毫秒，即 1 分钟

    // 手动保存函数
    function saveSlide() {
        var markdown = $('#editor').val();
        socket.send(JSON.stringify({
            'action': 'save',
            'markdown': markdown
        }));
        console.log('幻灯片已保存');
    }

    // 在页面关闭或刷新时，保存内容
    window.addEventListener('beforeunload', function (e) {
        saveSlide();
    });

    // 获取 CSRF token 的函数
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            let cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                // 检查这个 cookie 字符串是否以我们想要的名字开头
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    var csrftoken = getCookie('csrftoken');

    // 监听粘贴事件
    editor.addEventListener('paste', function (e) {
        var items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                var file = items[i].getAsFile();
                uploadImage(file);
                e.preventDefault();
            }
        }
    });

    // 监听拖放事件
    editor.addEventListener('drop', function (e) {
        e.preventDefault();
        var files = e.dataTransfer.files;
        for (var i = 0; i < files.length; i++) {
            if (files[i].type.indexOf('image') !== -1) {
                uploadImage(files[i]);
            }
        }
    });

    function uploadImage(file) {
        var formData = new FormData();
        formData.append('image', file);

        // 使用 AJAX 发送图片数据
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/upload_image/', true);

        xhr.onload = function () {
            if (xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.url) {
                    insertImageMarkdown(response.url);
                } else {
                    alert('上传失败');
                }
            } else {
                alert('上传失败');
            }
        };

        xhr.setRequestHeader('X-CSRFToken', csrftoken);
        xhr.send(formData);
    }

    function insertImageMarkdown(url) {
        var markdownImage = '![](' + url + ')';

        // 获取光标位置并插入文本
        var startPos = editor.selectionStart;
        var endPos = editor.selectionEnd;
        var value = editor.value;

        editor.value = value.substring(0, startPos) + markdownImage + value.substring(endPos);
        editor.selectionStart = editor.selectionEnd = startPos + markdownImage.length;

        // 触发输入事件，更新预览
        editor.dispatchEvent(new Event('input'));
    }

    // 解析幻灯片函数，支持新的分隔符
    function parseSlides(markdownText) {
        var lines = markdownText.split('\n');
        var slides = [];
        var position = 0;
        var currentSlideStart = 0;
        var hIndex = 0; // 水平索引
        var vIndex = 0; // 垂直索引

        for (var i = 0; i <= lines.length; i++) {
            var line = lines[i] || '';

            if (line.trim() === '---') {
                // 水平幻灯片分隔符
                slides.push({
                    start: currentSlideStart,
                    end: position,
                    h: hIndex,
                    v: vIndex
                });
                hIndex++;
                vIndex = 0;
                currentSlideStart = position + line.length + 1;
            } else if (line.trim() === '----' || line.trim() === '++++') {
                // 垂直幻灯片分隔符
                slides.push({
                    start: currentSlideStart,
                    end: position,
                    h: hIndex,
                    v: vIndex
                });
                vIndex++;
                currentSlideStart = position + line.length + 1;
            }

            position += line.length + 1; // +1 用于换行符
        }

        // 添加最后一张幻灯片
        slides.push({
            start: currentSlideStart,
            end: position,
            h: hIndex,
            v: vIndex
        });

        return slides;
    }

    // 导航到指定幻灯片
    function navigateToSlide(h, v) {
        var iframe = document.getElementById('preview-iframe');

        function doNavigate() {
            if (iframe.contentWindow && iframe.contentWindow.Reveal && iframe.contentWindow.Reveal.isReady()) {
                iframe.contentWindow.Reveal.slide(h, v);
            } else {
                // 等待并重试
                setTimeout(doNavigate, 50);
            }
        }

        doNavigate();
    }

    // 光标位置变化处理函数
    function onCursorPositionChange() {
        var cursorPos = editor.selectionStart;

        // 使用最新的幻灯片数组
        for (var i = 0; i < slides.length; i++) {
            var slide = slides[i];
            if (cursorPos >= slide.start && cursorPos <= slide.end) {
                var h = slide.h;
                var v = slide.v;

                // 如果幻灯片索引已改变
                if (h !== lastSlideIndices.h || v !== lastSlideIndices.v) {
                    lastSlideIndices.h = h;
                    lastSlideIndices.v = v;
                    // 导航到对应幻灯片
                    navigateToSlide(h, v);
                }
                break;
            }
        }
    }

    // 监听光标位置变化事件
    editor.addEventListener('keyup', onCursorPositionChange);
    editor.addEventListener('mouseup', onCursorPositionChange);

    // 初始化幻灯片解析
    slides = parseSlides(editor.value);

    // 初始设置光标位置事件
    onCursorPositionChange();

    // AI Feature Panel JavaScript
    const keywordsInput = document.getElementById('ai-keywords');
    const expandTopicBtn = document.getElementById('ai-expand-topic-btn');
    const topicTreeDiv = document.getElementById('ai-topic-tree');
    const generateOutlineBtn = document.getElementById('ai-generate-outline-btn');
    const aiFeedbackMessage = document.getElementById('ai-feedback-message'); // Added selector
    // 'editor' variable is already defined above: const editor = document.getElementById('editor');
    // 'csrftoken' variable is already defined above

    let selectedTopicElement = null; // Keep track of the selected topic element

    function renderTree(data, container) {
        container.innerHTML = ''; // Clear previous tree
        if (!data || !data.topic) { // Handle empty or invalid data
            container.innerHTML = '<p style="color: gray;">No topic data to display.</p>';
            return;
        }
        const rootUl = document.createElement('ul');
        rootUl.style.listStyleType = 'none';
        rootUl.style.paddingLeft = '0';
        appendTreeNode(data, rootUl);
        container.appendChild(rootUl);
    }

    function appendTreeNode(nodeData, parentUl) {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = nodeData.topic;
        span.className = 'topic-item';
        span.dataset.topic = nodeData.topic; 
        span.style.cursor = 'pointer';
        span.style.padding = '2px 5px'; // Add some padding for better clickability
        span.style.display = 'block'; // Make span take full width of li for easier clicking
        
        span.addEventListener('click', function(event) {
            event.stopPropagation();
            if (selectedTopicElement) {
                selectedTopicElement.style.fontWeight = 'normal';
                selectedTopicElement.style.backgroundColor = 'transparent';
            }
            this.style.fontWeight = 'bold';
            this.style.backgroundColor = '#e0e0e0'; // Highlight style
            selectedTopicElement = this;
            // console.log('Selected topic:', this.dataset.topic);
        });
        
        li.appendChild(span);

        if (nodeData.children && nodeData.children.length > 0) {
            const childrenUl = document.createElement('ul');
            childrenUl.style.listStyleType = 'none';
            childrenUl.style.paddingLeft = '20px'; // Indentation for children
            nodeData.children.forEach(childNode => {
                appendTreeNode(childNode, childrenUl);
            });
            li.appendChild(childrenUl);
        }
        parentUl.appendChild(li);
    }

    function insertOutlineIntoEditor(outlineLines) {
        // editor is globally available
        const outlineText = outlineLines.join('\n');
        if (editor.value.trim() !== '') {
            editor.value += '\n\n' + outlineText;
        } else {
            editor.value = outlineText;
        }
        // Trigger input event for WebSocket preview to update
        editor.dispatchEvent(new Event('input', { bubbles: true }));
    }

    expandTopicBtn.addEventListener('click', function() {
        const keywords = keywordsInput.value.trim();
        if (!keywords) {
            alert('Please enter keywords for topic expansion.');
            return;
        }

        topicTreeDiv.innerHTML = '<p style="color: gray;">Loading topic tree...</p>'; // Loading state
        if (aiFeedbackMessage) aiFeedbackMessage.textContent = ''; // Clear previous messages

        fetch('{% url "ai_topic_expand" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrftoken 
            },
            body: new URLSearchParams({'keywords': keywords})
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(errData => { // Try to parse error from backend
                    throw new Error(errData.error || ('Network response was not ok: ' + response.statusText));
                }).catch(() => { // If parsing error fails, use generic message
                     throw new Error('Network response was not ok: ' + response.statusText + ' and no error details from server.');
                });
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                console.error('Service Error (Topic Expand):', data.error);
                if (aiFeedbackMessage) aiFeedbackMessage.textContent = 'Error: ' + data.error;
                topicTreeDiv.innerHTML = ''; // Clear tree display
            } else {
                if (aiFeedbackMessage) aiFeedbackMessage.textContent = ''; // Clear error message
                renderTree(data, topicTreeDiv);
            }
        })
        .catch(error => {
            console.error('Error fetching topic tree:', error);
            if (aiFeedbackMessage) aiFeedbackMessage.textContent = 'Failed to fetch topic tree: ' + error.message;
            topicTreeDiv.innerHTML = ''; // Clear tree display
        });
    });

    generateOutlineBtn.addEventListener('click', function() {
        if (!selectedTopicElement) {
            // Using alert for this specific UI interaction feedback is fine
            alert('Please select a topic from the tree first.');
            return;
        }
        const selectedTopic = selectedTopicElement.dataset.topic;
        if (aiFeedbackMessage) aiFeedbackMessage.textContent = ''; // Clear previous messages

        // Optional: Add a loading state indication here if needed

        fetch('{% url "ai_generate_outline" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrftoken 
            },
            body: new URLSearchParams({'topic': selectedTopic})
        })
        .then(response => {
            if (!response.ok) {
                 return response.json().then(errData => {
                    throw new Error(errData.error || ('Network response was not ok: ' + response.statusText));
                }).catch(() => {
                     throw new Error('Network response was not ok: ' + response.statusText + ' and no error details from server.');
                });
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                console.error('Service Error (Generate Outline):', data.error);
                if (aiFeedbackMessage) aiFeedbackMessage.textContent = 'Error: ' + data.error;
            } else if (data.outline) {
                if (aiFeedbackMessage) aiFeedbackMessage.textContent = ''; // Clear error message
                insertOutlineIntoEditor(data.outline);
            } else {
                // This case should ideally not happen if backend is consistent
                if (aiFeedbackMessage) aiFeedbackMessage.textContent = 'Received unexpected data from server.';
            }
        })
        .catch(error => {
            console.error('Error generating outline:', error);
            if (aiFeedbackMessage) aiFeedbackMessage.textContent = 'Failed to generate outline: ' + error.message;
        });
    });

</script>
</body>
</html>
